/* Informatics skills catalogue — BilimTech's own interface inspired by topic-based learning */
:root{--ink:#102563;--edge:#dbe8fa;--lightblue:#f4f9ff;--bright:#0876ff;--mint:#08ba98}
body{background:linear-gradient(180deg,#f3faff 0%,#f8faff 50%,#f5f8ff 100%)}
.sitehead{border-bottom:1px solid #e3efff;background:#fff}
.navlinks a.active{background:#e8f4ff;color:#0068e8}
.platform-head{background:linear-gradient(110deg,#0a2a79 0%,#075bc6 55%,#007bdc 100%);border-radius:25px;color:white;min-height:220px;padding:33px 38px;display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:25px;position:relative;overflow:hidden;box-shadow:0 15px 45px #0656b32b;margin-bottom:22px}
.platform-head:before{content:'';position:absolute;border:2px solid #ffffff2c;border-radius:50%;height:330px;width:330px;right:80px;top:-100px;pointer-events:none}
.platform-head h1{font-size:clamp(26px,3.5vw,43px);margin:8px 0 8px;line-height:1.12;letter-spacing:-.6px}
.platform-head p{color:#e0f6ff;line-height:1.6;font-size:15px;margin:0;max-width:710px}
.platform-head .kicker{font-size:12px;font-weight:900;letter-spacing:.6px;color:#fff;display:inline-flex;align-items:center;gap:7px;background:#ffffff29;border:1px solid #ffffff35;padding:9px 13px;border-radius:999px}
.platform-head img{position:relative;z-index:1;align-self:center;justify-self:center;width:220px;max-height:180px;object-fit:contain;filter:drop-shadow(0 9px 10px #001b5355);border-radius:25px}
.catalog-layout{display:grid;grid-template-columns:238px minmax(0,1fr);gap:22px;align-items:start}
.catalog-side,.catalog-main{background:#fff;border:1px solid var(--edge);border-radius:21px;box-shadow:0 10px 30px #144c9b0d;overflow:hidden}
.catalog-side{position:sticky;top:103px;padding:16px}
.catalog-side h3{font-size:13px;color:#687b9a;margin:4px 8px 12px;text-transform:uppercase;letter-spacing:.6px}
.catalog-side a{display:flex;align-items:center;gap:11px;text-decoration:none;font-size:13px;color:#264174;border-radius:12px;padding:12px 10px;margin-bottom:4px;font-weight:750}
.catalog-side a.active{background:#eaf3ff;color:#006deb}
.catalog-side a .mark{font-size:18px;width:25px;text-align:center}
.catalog-side .helpnote{background:#ebfbf7;color:#13745e;border-radius:15px;padding:13px;margin-top:15px;font-size:12px;line-height:1.55}
.catalog-main{padding:24px}
.catalog-main h2{margin:0;color:#0e2b6c;font-size:25px}
.catalog-main .subtext{color:#6b7d9e;line-height:1.55;margin:10px 0 18px;font-size:14px}
.skill-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 20px}
.count-tag{color:#2561bd;background:#eaf4ff;border-radius:999px;padding:8px 13px;font-size:12px;font-weight:850}
.skill-search{font:inherit;padding:12px 15px;border:1px solid #cbdef8;border-radius:13px;width:min(360px,100%);background:#f9fcff;color:#17305d}
.skill-search:focus{outline:2px solid #6cb9ff}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:19px}
.filterbar button{background:#f3f7ff;border:1px solid #d9e5fa;border-radius:999px;color:#365786;padding:10px 14px;font-weight:750;font-size:12px}
.filterbar button.active,.filterbar button:hover{background:#116ffc;border-color:#116ffc;color:#fff}
.skill-group{margin-bottom:26px}
.skill-group h3{font-size:17px;color:#10286d;margin:0 0 10px;display:flex;align-items:center;gap:9px}
.skill-group h3:before{content:'';height:24px;width:6px;border-radius:9px;background:#007dff}
.skill-group:nth-child(even) h3:before{background:#00bb99}
.skill-table-head{display:grid;grid-template-columns:35% 28% 20% 17%;gap:10px;padding:13px 16px;border:1px solid #dae7fb;border-radius:12px 12px 0 0;background:#f0f7ff;color:#557398;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.3px}
.skill-row{display:grid;grid-template-columns:35% 28% 20% 17%;gap:10px;align-items:center;border:1px solid #e4ecf7;border-top:0;padding:15px 16px;background:#fff;transition:background .15s}
.skill-row:last-child{border-radius:0 0 14px 14px}
.skill-row:hover{background:#f7fbff}
.skill-name{display:flex;align-items:flex-start;gap:12px;min-width:0}
.skill-num{display:grid;place-items:center;min-width:36px;height:36px;background:linear-gradient(140deg,#d9f2ff,#dceaff);border:1px solid #bce0ff;border-radius:13px;color:#056bce;font-weight:950}
.skill-name strong{color:#122b67;line-height:1.45;font-size:13px}
.skill-name small{display:block;font-size:11px;color:#7083a7;margin-top:5px}
.skill-hint{font-size:12px;color:#506c94;line-height:1.45}
.skill-pill{font-size:11px;border-radius:10px;background:#eff8ff;color:#1868c4;padding:8px 9px;font-weight:800;display:inline-block;line-height:1.4}
.skill-pill.ready{background:#ddfaf0;color:#087d5b}
.skill-open{background:linear-gradient(115deg,#0572ff,#00a8e8);border:0;border-radius:11px;color:white;padding:11px 9px;font-weight:850;font-size:12px;text-decoration:none;display:block;text-align:center;white-space:normal}
.skill-open:hover{filter:brightness(.93)}
.skill-cards{display:none}
.training-banner{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#e9f7ff,#e9fff8);border:1px solid #c8e9f8;border-radius:16px;padding:17px;margin-top:15px}
.training-banner .emoji{font-size:32px}.training-banner strong{font-size:14px;color:#0d346d}.training-banner p{margin:5px 0 0;color:#436488;font-size:12px;line-height:1.5}
.lesson-info{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:22px}
.lesson-details{background:#f1f8ff;border:1px solid #d6e9ff;border-radius:16px;padding:20px}
.lesson-details h3{font-size:15px;color:#124d98;margin:0 0 10px}
.lesson-details p{font-size:13px;line-height:1.7;color:#466181;margin:0}
.lesson-details.tips{background:#eefcf8;border-color:#cdf1e4}
.lesson-details.tips h3{color:#008a69}
.lesson-quiz{background:white;border:1px solid #dbe9fb;border-radius:18px;overflow:hidden;margin:20px 0}
.quiz-head{background:linear-gradient(115deg,#143c94,#0869e6);padding:17px 19px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px}
.quiz-head h3{margin:0;font-size:18px;color:white}.quiz-head span{font-size:12px;color:#d5e7ff}
.quiz-inner{padding:18px}.quiz-question{font-size:15px;font-weight:850;margin:0 0 12px;color:#152f6f;line-height:1.5}
.quiz-answers{display:grid;gap:9px}.quiz-answer{display:flex;text-align:left;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#f7faff;border:1px solid #d7e7fa;color:#28416f;font-size:13px;font-weight:700}
.quiz-answer:hover{background:#e8f4ff}.quiz-answer[disabled]{cursor:default}.quiz-answer.correct{background:#ddf9ee;border-color:#21b88b;color:#0d7656}.quiz-answer.wrong{background:#fff0f2;border-color:#f28a9e;color:#ac324b}
.quiz-actions{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-top:14px}.quiz-feedback{font-size:13px;font-weight:800;color:#0d8670}.quiz-next{background:#0b75f9;border:0;border-radius:10px;color:white;padding:11px 15px;font-size:12px;font-weight:850}.quiz-next:disabled{opacity:.35;cursor:default}.quiz-progress{font-size:12px;color:#6681a9}

function render(){let hash=decodeURIComponent(location.hash||'#/');let route=hash.split('?')[0].replace(/^#\/?/,'').split('/').filter(Boolean);let page=route[0]||'home';let area=$('app');if(['home','collections'].includes(page)){area.innerHTML=pageHome();if(page==='collections')setTimeout(()=>document.querySelector('#collections')?.scrollIntoView(),0)}else if(page==='grade'){area.innerHTML=pageGrade(route[1])}else if(page==='lesson'&&['3','7','9'].includes(route[1])){area.innerHTML=route[1]==='7'?pageLesson(Number(route[2])):pageOtherLesson(route[1],Number(route[2]))}else if(page==='book'){area.innerHTML=pageBook(route[1])}else if(page==='documents'){area.innerHTML=pageDocuments()}else if(page==='contact'){area.innerHTML=pageContact()}else{area.innerHTML=pageHome()}

function openPreview(f){const body=$('modalBody');body.replaceChildren();$('modalTitle').textContent=f.title;const url=path(f.path);$('downloadFile').href=url;$('overlay').classList.add('open');document.body.style.overflow='hidden';if(f.slides&&f.slides.length){let i=0,img=el('img','slide-img');img.alt=f.title;img.title='Сілтемесі бар слайдты басқанда сыртқы ресурс ашылады';const nav=el('div','slide-tools'),prev=el('button','','← Алдыңғы'),next=el('button','','Келесі →'),label=el('strong'),links=el('div','slide-links'),players=el('div','slide-media');function update(){img.src=path(f.slides[i]);label.textContent=(i+1)+' / '+f.slides.length+' слайд';prev.disabled=i===0;next.disabled=i===f.slides.length-1;links.replaceChildren();players.replaceChildren();let uris=f.slideLinks?.[i+1]||[];img.style.cursor=(uris.length||(f.slideVideos?.[i+1]||[]).length)?'pointer':'default';img.onclick=uris.length?()=>window.open(uris[0],'_blank','noopener,noreferrer'):(f.slideVideos?.[i+1]||[]).length?()=>links.querySelector('button')?.click():null;uris.forEach((u,j)=>{let local=!/^https?:\/\//i.test(u);if(local&&!u.startsWith('materials/'))return;let a=el('a','',local?'🧩 Топтық интерактивті ойынды ашу ↗':'🔗 '+(j?'Қосымша сілтеме '+(j+1):'Слайдтағы сілтемені ашу ↗'));a.href=local?path(u):u;a.target='_blank';a.rel='noopener noreferrer';a.title=u;links.append(a)});(f.slideVideos?.[i+1]||[]).forEach((src,j)=>{let isAudio=/\.(m4a|mp3|wav)$/i.test(src);let b=el('button','',isAudio?'🔊 Слайдтағы дыбысты тыңдау':'▶ Слайдтағы '+(j+1)+'-видеоны ойнату');b.type='button';b.onclick=()=>{players.querySelectorAll('video').forEach(v=>v.pause());players.replaceChildren();let video=el(isAudio?'audio':'video');video.controls=true;video.playsInline=true;video.preload='metadata';video.src=path(src);video.style.maxHeight='240px';players.append(video);video.play().catch(()=>{});};links.append(b)})}prev.onclick=()=>{if(i>0){i--;update()}};next.onclick=()=>{if(i<f.slides.length-1){i++;update()}};nav.append(prev,label,next);body.append(img,nav,links,players);update();}
